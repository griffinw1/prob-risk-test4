<script>
const R=String.raw;
const SECTIONS=[
{id:"A",title:"A · Insurance payments",types:[
 {id:"A1",title:"P(insurer pays)",setup:R`Deductible \(d\): the insurer pays only when \(X\gt d\).
 $$P(\text{pays})=P(X\gt d)=S_X(d)=1-F_X(d)$$
 Given a density \(f_X\): integrate over the support. Given \(F_X\): plug in. Exponential: \(S_X(d)=e^{-d/\theta}\).<br>
 At least one of \(n\) independent losses paid: \(1-\big[F_X(d)\big]^n\).`,
 probs:[
  {q:R`A loss \(X\) has density
  $$f_X(x)=\begin{cases}\dfrac{3x^2}{1000}, & 0\lt x\lt 10\\[4pt] 0, & \text{otherwise.}\end{cases}$$
  The policy has a deductible of \(6\). Calculate the probability that the insurer pays something on a given loss.`,
  c:["0.216","0.360","0.640","0.784","0.936"],a:3,
  h:R`Find \(F_X(6)=\int_0^6 \frac{3x^2}{1000}\,dx\), then take the complement.`,
  s:R`$$F_X(x)=\frac{x^3}{1000}\ \Rightarrow\ P(X\gt 6)=1-\frac{216}{1000}=0.784$$`},
  {q:R`Losses are exponentially distributed with mean \(5000\), and the deductible is \(2000\) per loss. A policyholder has three independent losses. Calculate the probability that the insurer pays on at least one of them.`,
  c:["0.330","0.670","0.866","0.964","0.990"],a:3,
  h:R`First find \(F_X(2000)=1-e^{-2000/5000}\), the chance one loss gets nothing.`,
  s:R`$$F_X(2000)=1-e^{-0.4}=0.3297$$ $$P(\text{at least one})=1-(0.3297)^3=0.964$$`},
  {q:R`Losses have cumulative distribution function
  $$F_X(x)=\begin{cases}0,&x\lt 0\\ c\,(x^2+2x),&0\le x\le 8\\ 1,&x\gt 8\end{cases}$$
  The deductible is \(4\). Calculate the probability the insurer pays something.`,
  c:["0.250","0.300","0.375","0.700","0.750"],a:3,
  h:R`Use \(F_X(8)=1\) to find \(c\) first.`,
  s:R`$$1=c(64+16)\Rightarrow c=\tfrac{1}{80}$$ $$P(X\gt 4)=1-\tfrac{1}{80}(16+8)=1-0.3=0.700$$`}
 ]},
 {id:"A2",title:"E[payment] with deductible",setup:R`Payment per loss is \(Y=(X-d)_+\): zero when \(X\le d\), else \(X-d\).
 $$E[Y]=\int_d^{\text{top}}(x-d)\,f_X(x)\,dx=\int_d^{\text{top}}S_X(x)\,dx$$
 Exponential(\(\theta\)) shortcut: \(E[(X-d)_+]=\theta\,e^{-d/\theta}\). Uniform on \([0,b]\): \(\dfrac{(b-d)^2}{2b}\).`,
 probs:[
  {q:R`A loss is uniformly distributed on \([0,1000]\). The policy has a deductible of \(200\). Calculate the expected payment per loss.`,
  c:["160","320","400","480","800"],a:1,
  h:R`Set up \(\int_{200}^{1000}(x-200)\frac{1}{1000}\,dx\).`,
  s:R`$$E[Y]=\int_{200}^{1000}\frac{x-200}{1000}\,dx=\frac{800^2}{2000}=320$$`},
  {q:R`Losses are exponential with mean \(1000\). The deductible is \(500\). Calculate the expected payment per loss.`,
  c:["393","500","607","700","1000"],a:2,
  h:R`Use \(E[Y]=\int_{500}^{\infty}S_X(x)\,dx\) with \(S_X(x)=e^{-x/1000}\).`,
  s:R`$$E[Y]=\int_{500}^{\infty}e^{-x/1000}\,dx=1000\,e^{-0.5}=606.5$$`},
  {q:R`Losses have density
  $$f_X(x)=\frac{3\,(1000)^3}{x^4},\qquad x\gt 1000.$$
  The deductible is \(1500\). Calculate the expected payment per loss.`,
  c:["148","222","333","444","500"],a:1,
  h:R`Find \(S_X(x)=(1000/x)^3\), then integrate \(S_X\) from \(1500\) to \(\infty\).`,
  s:R`$$\int_{1500}^{\infty}\Big(\frac{1000}{x}\Big)^3dx=\frac{1000^3}{2\cdot 1500^2}=222.2$$`}
 ]},
 {id:"A3",title:"Per-payment (given X > d)",setup:R`“Given that a payment is made” means condition on \(X\gt d\):
 $$E[X-d\mid X\gt d]=\frac{E[(X-d)_+]}{S_X(d)}$$
 Exponential is memoryless: \(E[X-d\mid X\gt d]=\theta\), no matter what \(d\) is.`,
 probs:[
  {q:R`A loss is uniform on \([0,1000]\) with deductible \(200\). Calculate the expected payment, given that a payment is made.`,
  c:["320","360","400","500","600"],a:2,
  h:R`Per-loss expectation is \(320\). Divide by \(P(X\gt 200)\).`,
  s:R`$$\frac{320}{0.8}=400$$ Same as: given \(X\gt 200\), \(X\) is uniform on \([200,1000]\), so the excess averages \(400\).`},
  {q:R`Losses are exponential with mean \(2000\). The deductible is \(1000\). Calculate the expected payment given that the insurer makes a payment.`,
  c:["1000","1213","1500","2000","3000"],a:3,
  h:R`Memoryless: the excess over \(d\), given \(X\gt d\), has the same distribution as \(X\).`,
  s:R`$$E[X-1000\mid X\gt 1000]=\theta=2000$$`}
 ]},
 {id:"A4",title:"Caps and deductible + cap",setup:R`Maximum benefit \(u\): payment \(\min(X,u)\), so \(E=\int_0^u S_X(x)\,dx\).<br>
 Deductible \(d\) and max payment \(u\):
 $$E[\text{payment}]=\int_d^{d+u}S_X(x)\,dx$$
 Read carefully: “max payment \(u\)” versus “covers losses up to \(L\)” (then the upper limit is \(L\)).`,
 probs:[
  {q:R`A loss is uniform on \([0,100]\). The policy has no deductible and a maximum benefit of \(80\). Calculate the expected benefit.`,
  c:["40","48","50","64","80"],a:1,
  h:R`\(E[\min(X,80)]=\int_0^{80}\big(1-\tfrac{x}{100}\big)dx\).`,
  s:R`$$\int_0^{80}\Big(1-\frac{x}{100}\Big)dx=80-\frac{6400}{200}=48$$`},
  {q:R`Losses are exponential with mean \(10\). The policy has a deductible of \(2\) and a maximum payment of \(8\). Calculate the expected payment per loss.`,
  c:["3.68","4.51","5.13","6.70","8.19"],a:1,
  h:R`Integrate \(S_X(x)=e^{-x/10}\) from \(2\) to \(2+8=10\).`,
  s:R`$$\int_2^{10}e^{-x/10}dx=10\big(e^{-0.2}-e^{-1}\big)=4.51$$`}
 ]},
 {id:"A5",title:"Coinsurance and variance",setup:R`Policy pays a fraction \(p\) of the excess: \(Y=p\,(X-d)_+\).
 $$E[Y]=p\,E[(X-d)_+],\qquad \operatorname{Var}(aX+b)=a^2\operatorname{Var}(X)$$
 If every reported loss exceeds \(d\), then \(Y=p(X-d)\) exactly and \(\operatorname{Var}(Y)=p^2\operatorname{Var}(X)\).`,
 probs:[
  {q:R`Losses are exponential with mean \(1000\). The policy pays \(75\%\) of each loss in excess of a deductible of \(200\). Calculate the expected payment per loss.`,
  c:["450","600","614","750","819"],a:2,
  h:R`Exponential shortcut: \(E[(X-200)_+]=1000\,e^{-0.2}\). Then multiply by \(0.75\).`,
  s:R`$$0.75\cdot 1000\,e^{-0.2}=0.75(818.7)=614$$`},
  {q:R`A policyholder reports a loss only if it exceeds the deductible \(50\). Reported losses have variance \(400\). The policy pays \(60\%\) of the amount above the deductible. Calculate the variance of the claim payment on a reported loss.`,
  c:["96","144","160","240","400"],a:1,
  h:R`Payment is \(0.6(X-50)\). Shifting by \(50\) doesn't change variance.`,
  s:R`$$\operatorname{Var}[0.6(X-50)]=0.36\cdot 400=144$$`}
 ]},
 {id:"A6",title:"Solve for the deductible",setup:R`Write the condition as an equation in \(d\) and solve.
 $$S_X(d)=p\quad\text{or}\quad E[(X-d)_+]=k$$
 Exponential: \(e^{-d/\theta}=p\Rightarrow d=-\theta\ln p\).`,
 probs:[
  {q:R`Losses are exponential with mean \(1000\). The insurer wants the probability of making a payment on a loss to be \(0.6\). Calculate the deductible.`,
  c:["400","511","600","693","916"],a:1,
  h:R`Solve \(e^{-d/1000}=0.6\).`,
  s:R`$$d=-1000\ln(0.6)=510.8$$`},
  {q:R`A loss is uniform on \([0,1000]\). The insurer sets a deductible so the expected payment per loss is \(245\). Calculate the deductible.`,
  c:["255","300","350","505","700"],a:1,
  h:R`Use \(E=\dfrac{(1000-d)^2}{2000}=245\).`,
  s:R`$$(1000-d)^2=490000\Rightarrow 1000-d=700\Rightarrow d=300$$`}
 ]}
]},
{id:"B",title:"B · Normal family",types:[
 {id:"B1",title:"z-scores and percentiles",setup:R`$$Z=\frac{X-\mu}{\sigma},\qquad P(X\le x)=\Phi\Big(\frac{x-\mu}{\sigma}\Big)$$
 Percentile \(p\): \(x_p=\mu+z_p\,\sigma\). Note variance vs. standard deviation: \(\sigma=\sqrt{\text{Var}}\).`,
 probs:[
  {q:R`Annual profit is normal with mean \(100\) and standard deviation \(20\). Calculate the probability that profit exceeds \(130\).`,
  c:["0.0228","0.0668","0.1587","0.4332","0.9332"],a:1,
  h:R`\(z=\frac{130-100}{20}\). You want the right tail.`,
  s:R`$$P(X\gt 130)=1-\Phi(1.5)=1-0.9332=0.0668$$`},
  {q:R`The working lifetime of a bread maker is normal with mean \(10\) and variance \(4\). Calculate the \(12\)th percentile of the lifetime.`,
  c:["5.30","7.65","8.41","12.35","14.70"],a:1,
  h:R`\(\sigma=2\), not \(4\). Find \(z\) with \(\Phi(z)=0.12\).`,
  s:R`$$z_{0.12}\approx-1.175,\quad x=10-1.175(2)=7.65$$`}
 ]},
 {id:"B2",title:"Sums and differences",setup:R`For independent normals:
 $$X\pm Y\sim N\big(\mu_X\pm\mu_Y,\ \sigma_X^2+\sigma_Y^2\big)$$
 Variances always add, even for a difference. \(\operatorname{Var}(aX+bY)=a^2\sigma_X^2+b^2\sigma_Y^2\).`,
 probs:[
  {q:R`Claims \(X\sim N(100,15^2)\) and \(Y\sim N(80,20^2)\) are independent. Calculate \(P(X\gt Y)\).`,
  c:["0.5000","0.6554","0.7881","0.8413","0.9772"],a:2,
  h:R`Let \(D=X-Y\). Find its mean and variance.`,
  s:R`$$D\sim N(20,\ 225+400=625),\ \sigma_D=25$$ $$P(D\gt 0)=\Phi(0.8)=0.7881$$`},
  {q:R`Three independent claims are each normal with mean \(10\) and standard deviation \(3\). Calculate the probability that their total exceeds \(36\).`,
  c:["0.0228","0.1241","0.2743","0.3707","0.4207"],a:1,
  h:R`Total has mean \(30\) and variance \(3\cdot 9=27\).`,
  s:R`$$z=\frac{36-30}{\sqrt{27}}=1.155,\quad P=1-\Phi(1.155)=0.124$$`}
 ]},
 {id:"B3",title:"Central Limit Theorem",setup:R`For \(n\) iid values with mean \(\mu\), variance \(\sigma^2\):
 $$S_n\approx N(n\mu,\ n\sigma^2),\qquad \bar X\approx N\Big(\mu,\ \frac{\sigma^2}{n}\Big)$$
 Integer counts: use a continuity correction (\(\pm 0.5\)).`,
 probs:[
  {q:R`An insurer has \(5000\) independent policies, each with mean claim \(495\) and variance \(30{,}000\). Calculate the probability that total claims are less than \(2{,}500{,}000\).`,
  c:["0.5000","0.8413","0.9207","0.9794","0.9977"],a:3,
  h:R`Total mean \(=5000(495)\), total variance \(=5000(30000)\).`,
  s:R`$$\mu=2{,}475{,}000,\ \sigma=\sqrt{1.5\times10^8}=12{,}247$$ $$z=\frac{25{,}000}{12{,}247}=2.04,\ \ \Phi(2.04)=0.979$$`},
  {q:R`Claim sizes have mean \(2000\) and standard deviation \(500\). For a random sample of \(100\) claims, calculate the probability that the sample average exceeds \(2080\).`,
  c:["0.0548","0.0808","0.1151","0.4364","0.9452"],a:0,
  h:R`SD of the average is \(500/\sqrt{100}\).`,
  s:R`$$\sigma_{\bar X}=50,\ z=\frac{80}{50}=1.6,\ \ 1-\Phi(1.6)=0.0548$$`}
 ]}
]},
{id:"C",title:"C · Exponential and uniform",types:[
 {id:"C1",title:"Exponential tricks",setup:R`$$S(t)=e^{-t/\theta},\qquad \text{median}=\theta\ln 2$$
 Given a median \(m\): \(S(t)=0.5^{\,t/m}\). Given \(P(T\le a)=p\): \(S(t)=(1-p)^{t/a}\).`,
 probs:[
  {q:R`Time to failure is exponential with a median of \(4\) hours. Calculate the probability the component works for at least \(5\) hours.`,
  c:["0.2865","0.3679","0.4204","0.5000","0.5796"],a:2,
  h:R`\(S(t)=0.5^{t/4}\).`,
  s:R`$$S(5)=0.5^{5/4}=0.420$$`},
  {q:R`Time until a high-risk driver's accident is exponential. \(30\%\) have an accident in the first \(50\) days. What proportion have one in the first \(80\) days?`,
  c:["0.3600","0.4349","0.4800","0.5650","0.6000"],a:1,
  h:R`\(S(50)=0.7\), so \(S(t)=0.7^{t/50}\).`,
  s:R`$$P(T\le 80)=1-0.7^{80/50}=1-0.7^{1.6}=0.435$$`}
 ]},
 {id:"C2",title:"Uniform losses",setup:R`\(X\sim U[a,b]\): \(f=\frac{1}{b-a}\), \(E[X]=\frac{a+b}{2}\), \(\operatorname{Var}=\frac{(b-a)^2}{12}\).
 $$E[(X-d)_+]=\frac{(b-d)^2}{2(b-a)},\quad a\le d\le b$$`,
 probs:[
  {q:R`Under two policies, a loss is uniform on \([a,25]\). Policy A has no deductible and expected payment \(15\). Policy B has deductible \(9\). Calculate the expected payment under policy B.`,

const LEVELS=["Rookie","Analyst","Actuary I","Actuary II","Chief Actuary","Risk Master"];
const KEY="probRiskT4_v1";
let st={xp:0,streak:0,best:0,done:{},cur:"A1",idx:{}};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s)st=Object.assign(st,s);}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}};
let attempt={tries:0,hinted:false,over:false};
const $=id=>document.getElementById(id);
const ALL=[];SECTIONS.forEach(s=>s.types.forEach(t=>t.probs.forEach((p,i)=>ALL.push(t.id+"."+(i+1)))));
const typeById=id=>{for(const s of SECTIONS)for(const t of s.types)if(t.id===id)return[s,t];st.cur=SECTIONS[0].types[0].id;return[SECTIONS[0],SECTIONS[0].types[0]];};
function math(el){renderMathInElement(el,{delimiters:[{left:"$$",right:"$$",display:true},{left:"\\(",right:"\\)",display:false}],throwOnError:false});}
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("show"),1800);}
function hud(){const lv=Math.min(LEVELS.length-1,Math.floor(st.xp/60));$("lvl").textContent=lv+1;$("lvlname").textContent=LEVELS[lv];$("xp").textContent=st.xp;$("streak").textContent=st.streak;
 const solved=Object.values(st.done).filter(v=>v==="ok").length;$("solved").textContent=solved;$("total").textContent=ALL.length;$("xpfill").style.width=(lv>=LEVELS.length-1?100:(st.xp%60)/60*100)+"%";}
function side(){const el=$("side");el.innerHTML="";SECTIONS.forEach(s=>{const ids=[];s.types.forEach(t=>t.probs.forEach((p,i)=>ids.push(t.id+"."+(i+1))));const ok=ids.filter(i=>st.done[i]).length;
 const d=document.createElement("div");d.className="sec";d.innerHTML=`<div class="sech"><h3>${s.title}</h3><small>${ok}/${ids.length}</small></div><div class="sbar"><i style="width:${ok/ids.length*100}%"></i></div>`;
 s.types.forEach(t=>{const n=t.probs.length,k=t.probs.filter((p,i)=>st.done[t.id+"."+(i+1)]).length;const b=document.createElement("button");b.className="type"+(t.id===st.cur?" on":"")+(k===n?" done":"");b.innerHTML=`<span>${t.id} · ${t.title}</span><em>${k===n?"✓":k+"/"+n}</em>`;b.onclick=()=>{st.cur=t.id;save();show();};d.appendChild(b);});el.appendChild(d);});}
function badges(){const el=$("badges");el.innerHTML="";const list=SECTIONS.map(s=>{const ids=[];s.types.forEach(t=>t.probs.forEach((p,i)=>ids.push(t.id+"."+(i+1))));return[s.title.split("·")[1].trim()+" cleared",ids.every(i=>st.done[i]==="ok")];});
 list.push(["Streak of 5",st.best>=5],["Streak of 10",st.best>=10],["180 XP club",st.xp>=180],["All solved",Object.values(st.done).filter(v=>v==="ok").length===ALL.length]);
 list.forEach(([n,g])=>{const b=document.createElement("span");b.className="bdg"+(g?" got":"");b.textContent=(g?"★ ":"☆ ")+n;el.appendChild(b);});}
function show(){const[s,t]=typeById(st.cur);const i=Math.min(st.idx[t.id]||0,t.probs.length-1);const p=t.probs[i];const pid=t.id+"."+(i+1);
 attempt={tries:0,hinted:false,over:!!st.done[pid]};
 $("crumb").innerHTML=`${s.title} › <b>${t.id} · ${t.title}</b>`;$("setup").innerHTML=t.setup;math($("setup"));
 $("qid").textContent="Problem "+pid;$("worth").textContent=st.done[pid]?(st.done[pid]==="ok"?"Solved":"Revealed"):"10 XP";
 $("q").innerHTML=p.q;math($("q"));
 const ch=$("ch");ch.innerHTML="";p.c.forEach((c,j)=>{const b=document.createElement("button");b.className="c";b.innerHTML=`<span class="L">${"ABCDE"[j]}</span><span>${c.includes("\\(")?c:"\\("+c+"\\)"}</span>`;b.onclick=()=>pick(j,b,p,pid);ch.appendChild(b);});math(ch);
 $("msg").textContent="";$("hint").hidden=true;$("sol").hidden=true;$("hint").innerHTML="";$("sol").innerHTML="";
 if(st.done[pid]){ch.children[p.a].classList.add("good");[...ch.children].forEach(b=>b.disabled=true);solution(p);}
 const dots=$("dots");dots.innerHTML="";t.probs.forEach((q,j)=>{const id=t.id+"."+(j+1);const d=document.createElement("button");d.className="dot"+(j===i?" on":"")+(st.done[id]==="ok"?" ok":st.done[id]?" rev":"");d.textContent=j+1;d.onclick=()=>{st.idx[t.id]=j;save();show();};dots.appendChild(d);});
 side();hud();badges();}
function solution(p){const e=$("sol");e.innerHTML="<b>Solution · answer "+"ABCDE"[p.a]+"</b>"+p.s;e.hidden=false;math(e);}
function pick(j,b,p,pid){if(attempt.over)return;attempt.tries++;
 if(j===p.a){b.classList.add("good");attempt.over=true;let g=attempt.tries===1?10:attempt.tries===2?5:2;if(attempt.hinted)g=Math.max(0,g-3);st.streak=attempt.tries===1?st.streak+1:0;st.best=Math.max(st.best,st.streak);
  const bonus=st.streak>0&&st.streak%5===0?10:0;st.xp+=g+bonus;st.done[pid]="ok";save();
  $("msg").style.color="var(--green)";$("msg").textContent=`+${g+bonus} XP`+(bonus?" · streak bonus!":"");[...$("ch").children].forEach(x=>x.disabled=true);solution(p);burst(b);
  const before=Math.floor((st.xp-g-bonus)/60),after=Math.floor(st.xp/60);if(after>before&&after<LEVELS.length)toast("Level up · "+LEVELS[after]);else if(bonus)toast("Streak of "+st.streak+" · +10 bonus");
  side();hud();badges();$("worth").textContent="Solved";$("dots").querySelector(".on").classList.add("ok");}
 else{b.classList.add("bad");b.disabled=true;st.streak=0;save();hud();$("msg").style.color="var(--red)";$("msg").textContent=attempt.tries===1?"Not quite · try again (5 XP left)":"Still off · try again or take a hint";}}
$("hintbtn").onclick=()=>{const[s,t]=typeById(st.cur);const p=t.probs[st.idx[t.id]||0];if(!attempt.hinted&&!attempt.over){attempt.hinted=true;}$("hint").innerHTML="<b>Hint</b>"+p.h;$("hint").hidden=false;math($("hint"));};
$("revbtn").onclick=()=>{const[s,t]=typeById(st.cur);const i=st.idx[t.id]||0;const p=t.probs[i];const pid=t.id+"."+(i+1);if(!attempt.over){attempt.over=true;st.streak=0;if(!st.done[pid])st.done[pid]="rev";save();[...$("ch").children].forEach(x=>x.disabled=true);$("ch").children[p.a].classList.add("good");$("worth").textContent="Revealed";}solution(p);side();hud();};
$("next").onclick=()=>{const order=[];SECTIONS.forEach(s=>s.types.forEach(t=>t.probs.forEach((p,i)=>order.push([t.id,i]))));const[s,t]=typeById(st.cur);const cur=order.findIndex(o=>o[0]===t.id&&o[1]===(st.idx[t.id]||0));
 let n=order.slice(cur+1).find(o=>!st.done[o[0]+"."+(o[1]+1)])||order.find(o=>!st.done[o[0]+"."+(o[1]+1)])||order[(cur+1)%order.length];st.cur=n[0];st.idx[n[0]]=n[1];save();show();window.scrollTo({top:0,behavior:"smooth"});};
$("reset").onclick=()=>{if(confirm("Reset all XP and progress?")){st={xp:0,streak:0,best:0,done:{},cur:"A1",idx:{}};save();show();}};
const th=()=>{let t;try{t=localStorage.getItem(KEY+"_theme");}catch(e){}document.documentElement.dataset.theme=t||"dark";};th();
$("theme").onclick=()=>{const n=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=n;try{localStorage.setItem(KEY+"_theme",n);}catch(e){}};
const cv=$("fx"),cx=cv.getContext("2d");let parts=[];function size(){cv.width=innerWidth;cv.height=innerHeight;}size();addEventListener("resize",size);
function burst(el){if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;const r=el.getBoundingClientRect();for(let k=0;k<36;k++)parts.push({x:r.left+r.width*0.2,y:r.top+r.height/2,vx:(Math.random()*2-0.5)*6,vy:-Math.random()*7-2,l:60,c:["#d97757","#e8a58c","#5fa776","#f5f4ee"][k%4],s:Math.random()*3+2});if(parts.length<=36)loop();}
function loop(){cx.clearRect(0,0,cv.width,cv.height);parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.25;p.l--;cx.globalAlpha=Math.max(0,p.l/60);cx.fillStyle=p.c;cx.fillRect(p.x,p.y,p.s,p.s);});parts=parts.filter(p=>p.l>0);if(parts.length)requestAnimationFrame(loop);else cx.clearRect(0,0,cv.width,cv.height);}
</script>

<script>show();</script>
